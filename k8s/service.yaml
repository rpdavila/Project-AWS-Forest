apiVersion: v1
kind: Service
metadata:
  name: learningsteps-api                 # e.g. learningsteps-api
  namespace: learningsteps             # where your app lives
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer                  # the type that asks for a cloud load balancer
  selector:
    app: learningsteps-api               # must match the pod labels (I checked: {"app":"learningsteps-api"})
  ports:
    - name: http
      port: 80                # what the internet connects to
      targetPort: 8000        # the container's port; you can use its NAME (yours is "http" → 8000)
      protocol: TCP