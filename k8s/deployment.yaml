apiVersion: apps/v1
kind: Deployment
metadata:
  name: learningsteps-api
  namespace: learningsteps
  labels:
    app: learningsteps-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learningsteps-api
  template:
    metadata:
      labels:
        app: learningsteps-api
    spec:
      serviceAccountName: learningsteps-api
      containers:
        - name: api
          image: 062163939903.dkr.ecr.us-east-1.amazonaws.com/rafael-forestproject/learningsteps:ed15632
          ports:
            - name: http
              containerPort: 8000
          command: ["sh", "-c"]
          args:
            - >-
              export PGPASSWORD="$(cat /mnt/secret-store/db-password)" &&
              exec uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://learningsteps@rafael-forestproject-postgres.c2lwyyccqo71.us-east-1.rds.amazonaws.com:5432/learning_journal?sslmode=require"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-secret
              mountPath: /mnt/secret-store
              readOnly: true
      volumes:
        - name: db-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: learningsteps-api